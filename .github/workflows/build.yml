name: Build
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  test-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: 'macos-latest' # for Univrsal based macs.
          #   args: '--verbose --target universal-apple-darwin'
          #   platform-name: 'Macos-Universal'
          - platform: 'macos-latest'
            args: '--debug --target aarch64-apple-darwin'
            platform-name: 'Macos aarch64'
          - platform: 'ubuntu-latest' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: '--debug'
            platform-name: 'Linux'
          - platform: 'windows-latest'
            args: '--debug'
            platform-name: 'Windows'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app_token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            wombat
            wombat-core
      - name: Authenticate Git for private repos
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com".insteadOf "ssh://git@github.com"
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: './.github/actions/prepare-build-env'
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
